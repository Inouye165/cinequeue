# CI-only workflow: runs tests and builds, never deploys
# Used by GitHub pull-request trigger
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Backend tests
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        python -m pip install --no-cache-dir -r backend/requirements.txt
        python -m pytest backend/tests/ -v
    dir: "."

  # Frontend tests (using lockfile)
  - name: node:22
    entrypoint: npm
    args: ["ci"]
    dir: "frontend"
  - name: node:22
    entrypoint: npm
    args: ["run", "test"]
    dir: "frontend"

  # Build production frontend
  - name: node:22
    entrypoint: npm
    args: ["run", "build"]
    dir: "frontend"

  # Offline PWA browser regressions
  - name: node:22
    entrypoint: bash
    args: ["-c", "npx playwright install --with-deps chromium && npm run test:e2e"]
    dir: "frontend"

  # Validate Docker build (no push, no deploy)
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "cinequeue-ci-test", "."]
